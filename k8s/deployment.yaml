apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid-retail
  labels:
    app: pulsegrid-retail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsegrid-retail
  template:
    metadata:
      labels:
        app: pulsegrid-retail
    spec:
      containers:
        - name: pulsegrid-retail
          image: pulsegrid-retail:latest
          ports:
            - containerPort: 8501
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid-retail
  labels:
    app: pulsegrid-retail
spec:
  type: ClusterIP
  selector:
    app: pulsegrid-retail
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
